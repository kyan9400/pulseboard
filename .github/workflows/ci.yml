name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Build package
        if: matrix.python-version == '3.13'
        run: python -m build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag pulseboard:test .

      - name: Build Vercel image
        run: docker build --file Dockerfile.vercel --tag pulseboard:vercel .

      - name: Inspect Vercel runtime user
        run: test "$(docker run --rm --entrypoint=id pulseboard:vercel -u)" != "0"

      - name: Inspect runtime user
        run: test "$(docker run --rm --entrypoint=id pulseboard:test -u)" != "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulseboard:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test image
        run: |
          docker run --detach --name pulseboard-smoke --publish 18000:8000 pulseboard:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health/ready; then
              curl --fail --silent http://127.0.0.1:18000/status | grep --quiet "Service status"
              exit 0
            fi
            sleep 1
          done
          docker logs pulseboard-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force pulseboard-smoke || true
